[project]
name = "agentic-analytics"
version = "0.1.0"
description = "Secure, cited text-to-SQL agent over MCP, grounded by enterprise RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.5",
    "sqlglot>=26.0",
    "openai>=1.60",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "servers", "agent", "ingestion", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: needs the running Postgres from docker compose"]

[tool.ruff]
line-length = 100
target-version = "py312"
